<style>
/* Layout: one-screen app shell (sticky header, scrolling view, bottom tab bar, bottom sheets). Five skins; every colour, font, radius and surface treatment is a token so a skin only redefines tokens plus a handful of structural rules. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface2:#F1F3F6; --line:#E7EAEF; --rule:#E7EAEF; --fg:#111418; --muted:#6B7280;
  --accent:#1F6FEB; --accent-fg:#FFFFFF; --accent-soft:rgba(31,111,235,.10); --mark:#1F6FEB; --mark-fg:#FFFFFF;
  --good:#22C55E; --good-fg:#FFFFFF; --bad:#DC2626; --info:#1F6FEB;
  --g-benen:#1F6FEB; --g-rug:#16A34A; --g-borst:#DC2626; --g-schouders:#7C3AED; --g-armen:#D97706; --g-core:#0D9488;
  --display:"Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"Inter",system-ui,sans-serif; --label:"Inter",system-ui,sans-serif;
  --h-weight:700; --h-transform:none; --h-spacing:-.01em; --label-spacing:.06em;
  --r:14px; --r-in:9px; --r-btn:11px; --r-ok:9px; --r-fig:11px;
  --card-bg:var(--surface); --card-border:transparent; --card-shadow:0 1px 2px rgba(16,24,40,.06);
  --hd-bg:#FFFFFF; --hd-fg:#111418; --hd-border:1px solid #E7EAEF;
  --nav-bg:#FFFFFF; --nav-fg:#8B93A1; --nav-on:#1F6FEB; --nav-on-bg:transparent; --nav-border:1px solid #E7EAEF;
  --in-bg:#F1F3F6; --in-border:transparent; --btn-bg:#FFFFFF; --btn-border:#E7EAEF;
  --timer-bg:#1F6FEB; --timer-fg:#FFFFFF; --sheet-bg:#F6F7F9; --shadow:0 12px 32px rgba(16,24,40,.18);
  color-scheme:light;
}
:root[data-skin="ledger"]{
  --bg:#1C1E22; --surface:#202327; --surface2:#15171A; --line:#33363C; --rule:#33363C; --fg:#E8E6E1; --muted:#9A9890;
  --accent:#E84A2A; --accent-fg:#FFFFFF; --accent-soft:rgba(232,74,42,.14); --mark:#E84A2A; --mark-fg:#FFFFFF;
  --good:#E84A2A; --good-fg:#FFFFFF; --bad:#E84A2A; --info:#9A9890;
  --g-benen:#E8E6E1; --g-rug:#E8E6E1; --g-borst:#E8E6E1; --g-schouders:#E8E6E1; --g-armen:#E8E6E1; --g-core:#E8E6E1;
  --display:"Oswald",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace; --label:"DM Mono",ui-monospace,monospace;
  --h-weight:600; --h-transform:uppercase; --h-spacing:.04em; --label-spacing:.08em;
  --r:3px; --r-in:3px; --r-btn:3px; --r-ok:3px; --r-fig:3px;
  --card-bg:#202327; --card-border:#33363C; --card-shadow:none;
  --hd-bg:#1C1E22; --hd-fg:#E8E6E1; --hd-border:2px solid #E84A2A;
  --nav-bg:#15171A; --nav-fg:#6C6F76; --nav-on:#E84A2A; --nav-on-bg:transparent; --nav-border:1px solid #33363C;
  --in-bg:#15171A; --in-border:#33363C; --btn-bg:#202327; --btn-border:#33363C;
  --timer-bg:#E84A2A; --timer-fg:#FFFFFF; --sheet-bg:#1C1E22; --shadow:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-skin="night"]{
  --bg:#000000; --surface:#121214; --surface2:#1C1C1F; --line:#232326; --rule:#232326; --fg:#FFFFFF; --muted:#8A8A8E;
  --accent:#FF2D55; --accent-fg:#FFFFFF; --accent-soft:rgba(255,45,85,.14); --mark:#FF2D55; --mark-fg:#FFFFFF;
  --good:#FF2D55; --good-fg:#FFFFFF; --bad:#FF2D55; --info:#8A8A8E;
  --g-benen:#FFFFFF; --g-rug:#FFFFFF; --g-borst:#FFFFFF; --g-schouders:#FFFFFF; --g-armen:#FFFFFF; --g-core:#FFFFFF;
  --display:"Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"Manrope",system-ui,sans-serif; --label:"Manrope",system-ui,sans-serif;
  --h-weight:800; --h-transform:none; --h-spacing:-.03em; --label-spacing:.06em;
  --r:18px; --r-in:10px; --r-btn:14px; --r-ok:50%; --r-fig:12px;
  --card-bg:#121214; --card-border:transparent; --card-shadow:none;
  --hd-bg:#000000; --hd-fg:#FFFFFF; --hd-border:0;
  --nav-bg:#000000; --nav-fg:#5A5A5E; --nav-on:#FFFFFF; --nav-on-bg:transparent; --nav-border:0;
  --in-bg:#1C1C1F; --in-border:transparent; --btn-bg:#1C1C1F; --btn-border:transparent;
  --timer-bg:#FFFFFF; --timer-fg:#000000; --sheet-bg:#0A0A0B; --shadow:0 12px 32px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-skin="coach"]{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface2:#EEF3EC; --line:#E1E8DF; --rule:#E1E8DF; --fg:#1B2420; --muted:#5F6B66;
  --accent:#1E5A46; --accent-fg:#FFFFFF; --accent-soft:rgba(30,90,70,.10); --mark:#1E5A46; --mark-fg:#FFFFFF;
  --good:#1E5A46; --good-fg:#FFFFFF; --bad:#C2410C; --info:#1E5A46;
  --g-benen:#1E5A46; --g-rug:#2E7D5B; --g-borst:#B4532A; --g-schouders:#4F6D8A; --g-armen:#8A6A1E; --g-core:#2A7F7A;
  --display:"Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif; --mono:"Figtree",system-ui,sans-serif; --label:"Figtree",system-ui,sans-serif;
  --h-weight:700; --h-transform:none; --h-spacing:-.01em; --label-spacing:.05em;
  --r:18px; --r-in:11px; --r-btn:14px; --r-ok:50%; --r-fig:14px;
  --card-bg:#FFFFFF; --card-border:transparent; --card-shadow:0 6px 18px rgba(30,90,70,.08);
  --hd-bg:#1E5A46; --hd-fg:#FFFFFF; --hd-border:0;
  --nav-bg:#FFFFFF; --nav-fg:#9AA8A1; --nav-on:#1E5A46; --nav-on-bg:rgba(30,90,70,.10); --nav-border:0;
  --in-bg:#EEF3EC; --in-border:transparent; --btn-bg:#FFFFFF; --btn-border:#E1E8DF;
  --timer-bg:#1E5A46; --timer-fg:#FFFFFF; --sheet-bg:#F3F6F2; --shadow:0 12px 32px rgba(30,90,70,.18);

}
:root[data-skin="grid"]{
  --bg:#FAFAF8; --surface:#FAFAF8; --surface2:#F0F0EC; --line:#C8C8C4; --rule:#111111; --fg:#111111; --muted:#666666;
  --accent:#111111; --accent-fg:#FFE14D; --accent-soft:#FFE14D; --mark:#FFE14D; --mark-fg:#111111;
  --good:#111111; --good-fg:#FFE14D; --bad:#B3261E; --info:#111111;
  --g-benen:#111111; --g-rug:#111111; --g-borst:#111111; --g-schouders:#111111; --g-armen:#111111; --g-core:#111111;
  --display:"DM Sans",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace; --label:"DM Mono",ui-monospace,monospace;
  --h-weight:700; --h-transform:none; --h-spacing:-.02em; --label-spacing:.08em;
  --r:0; --r-in:0; --r-btn:0; --r-ok:0; --r-fig:0;
  --card-bg:transparent; --card-border:#111111; --card-shadow:none;
  --hd-bg:#FAFAF8; --hd-fg:#111111; --hd-border:1px solid #111111;
  --nav-bg:#FAFAF8; --nav-fg:#999999; --nav-on:#111111; --nav-on-bg:transparent; --nav-border:1px solid #111111;
  --in-bg:transparent; --in-border:#C8C8C4; --btn-bg:transparent; --btn-border:#111111;
  --timer-bg:#111111; --timer-fg:#FFE14D; --sheet-bg:#FAFAF8; --shadow:0 12px 32px rgba(0,0,0,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hd-bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:var(--h-weight);letter-spacing:var(--h-spacing);text-transform:var(--h-transform)}
h1{font-size:26px;line-height:1.1}
h2{font-size:19px}
h3{font-size:12px;font-family:var(--label);font-weight:600;text-transform:uppercase;letter-spacing:var(--label-spacing);color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--in-bg);border:1px solid var(--in-border);border-radius:var(--r-in);padding:10px 12px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums;font-family:var(--mono)}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
label.f>span{font-family:var(--label);letter-spacing:var(--label-spacing);text-transform:uppercase;font-size:11px}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11px;font-family:var(--label);text-transform:uppercase;letter-spacing:var(--label-spacing);color:var(--muted);font-weight:600}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd-bg);color:var(--hd-fg);padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:var(--hd-border)}
.top .brand{font-family:var(--display);font-weight:var(--h-weight);font-size:19px;letter-spacing:var(--h-spacing);text-transform:var(--h-transform);display:flex;align-items:center;gap:8px;min-width:0}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand i{display:inline-block;width:20px;height:20px;color:var(--accent);flex:none}
.top .x svg{width:18px;height:18px}
#hdRight{gap:8px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
#view>*,.sheet .sb>*{flex-shrink:0}
.tabs{display:flex;background:var(--nav-bg);border-top:var(--nav-border);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:var(--r-btn);color:var(--nav-fg);font-size:10px;font-weight:600;font-family:var(--label);letter-spacing:.03em;text-transform:uppercase}
.tabs button svg{width:21px;height:21px}
.tabs button.on{color:var(--nav-on);background:var(--nav-on-bg)}

/* components */
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);padding:14px;box-shadow:var(--card-shadow)}
.card.hero{border-color:var(--card-border)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-btn);font-weight:600;background:var(--btn-bg);border:1px solid var(--btn-border);min-height:44px}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;font-family:var(--label);background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;letter-spacing:.03em}
.pill.acc{background:var(--mark);color:var(--mark-fg);border-color:transparent}
.pill.good{color:var(--good-fg);background:var(--good);border-color:transparent}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--mark);color:var(--mark-fg);border-color:var(--mark)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:var(--r);background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow);text-align:left;min-width:0}
.mi svg{width:20px;height:20px;color:var(--accent);margin-bottom:4px}
.mi b{font-weight:600}
.mi span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);padding:10px 12px;min-width:0;box-shadow:var(--card-shadow)}
.tile b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-weight:var(--h-weight);letter-spacing:var(--h-spacing);font-variant-numeric:tabular-nums}
.tile span{font-size:10px;color:var(--muted);font-family:var(--label);text-transform:uppercase;letter-spacing:var(--label-spacing);font-weight:600}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:0}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600;white-space:nowrap}
.fig{width:46px;height:46px;border-radius:var(--r-fig);background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--fg)}
.fig svg{width:38px;height:38px}
.fig.lg{width:100%;height:170px;border-radius:var(--r)}
.fig.lg svg{width:160px;height:160px}
.g-Benen{color:var(--g-benen)} .g-Rug{color:var(--g-rug)} .g-Borst{color:var(--g-borst)} .g-Schouders{color:var(--g-schouders)} .g-Armen{color:var(--g-armen)} .g-Core{color:var(--g-core)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.empty{text-align:center;color:var(--muted);padding:26px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:4px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* workout table */
.ex{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden;box-shadow:var(--card-shadow)}
.ex .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex .hd .t{flex:1;min-width:0}
.ex .hd b{display:block;font-family:var(--display);font-size:17px;line-height:1.15;font-weight:var(--h-weight);letter-spacing:var(--h-spacing);text-transform:var(--h-transform)}
.ex .hd span{font-size:12px;color:var(--muted)}
.sets{display:grid;grid-template-columns:30px 1fr 72px 62px 44px;gap:6px 8px;padding:10px 12px;align-items:center}
.sets .h{font-size:10px;color:var(--muted);font-family:var(--label);text-transform:uppercase;letter-spacing:var(--label-spacing);font-weight:600;text-align:center}
.sets .h:nth-child(2){text-align:left}
.sets .n{text-align:center;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono);min-height:38px;border-radius:var(--r-in)}
.sets .n:active{background:var(--surface2)}
.sets .snote{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 4px;padding-left:4px}
.sets .tg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{padding:8px 6px;text-align:center}
.sets .ok{width:40px;height:38px;border-radius:var(--r-ok);border:1px solid var(--in-border);background:var(--in-bg);display:grid;place-items:center;color:var(--muted);margin:0 auto}
.sets .ok.on{background:var(--good);color:var(--good-fg);border-color:var(--good)}
.sets .ok svg{width:18px;height:18px}
.ex .ft{display:flex;gap:8px;padding:8px 12px 12px}
.amrap{color:var(--accent);font-weight:700}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--timer-bg);color:var(--timer-fg);padding:8px 10px 8px 16px;border-radius:calc(var(--r-btn) * 3);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:6;font-weight:700;font-variant-numeric:tabular-nums}
.timer b{font-family:var(--mono);font-size:22px;min-width:62px}
.timer button{background:rgba(127,127,127,.25);color:inherit;width:34px;height:34px;border-radius:var(--r-ok);display:grid;place-items:center;font-size:16px;font-weight:700}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet-bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease-out;border-top:1px solid var(--card-border)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .sb{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.x{width:36px;height:36px;border-radius:var(--r-ok);background:var(--surface2);display:grid;place-items:center;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--timer-bg);color:var(--timer-fg);padding:10px 16px;border-radius:var(--r-btn);font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:90%}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:10px;color:var(--muted);font-family:var(--label);font-weight:600;padding:4px 0;text-transform:uppercase}
.cal .d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--r-in);font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14px;gap:3px;color:var(--fg)}
.cal .d.o{color:var(--muted);opacity:.45}
.cal .d.t{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.cal .d.w{background:var(--accent-soft);font-weight:700}
.cal .d.sel{background:var(--mark);color:var(--mark-fg)}
.cal .d i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.cal .d.sel i{background:var(--mark-fg)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--timer-bg);color:var(--timer-fg);font-size:12px;padding:5px 8px;border-radius:var(--r-in);white-space:nowrap;transform:translate(-50%,-110%);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);z-index:2}
.chart .tip[hidden]{display:none}
.hbar{display:grid;grid-template-columns:90px 1fr 48px;gap:8px;align-items:center;font-size:13px}
.hbar .bar{height:10px;border-radius:calc(var(--r-in) / 2);background:var(--surface2);overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:inherit;background:currentColor}
.scheme{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:var(--r);text-align:left;width:100%;background:var(--card-bg)}
.scheme.on{border-color:var(--accent);background:var(--accent-soft)}
.scheme b{display:block;font-family:var(--display);font-size:17px;font-weight:var(--h-weight)}
.scheme span{font-size:13px;color:var(--muted)}
.weekrow{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.weekrow:last-child{border-bottom:0}
.weekrow b{font-family:var(--display);font-size:16px}
.onb{display:flex;flex-direction:column;gap:16px;max-width:520px;margin:0 auto;width:100%}
.onb h1{font-size:34px}
.onb .lede{font-size:16px;color:var(--muted);max-width:40ch}
.segs{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-in);padding:3px;gap:3px}
.segs button{flex:1;padding:8px;border-radius:calc(var(--r-in) - 2px);font-weight:600;color:var(--muted);font-size:13px}
.segs button.on{background:var(--mark);color:var(--mark-fg)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);text-align:right}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.pr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-in);background:var(--accent-soft);color:var(--fg)}
.pr svg{width:20px;height:20px;color:var(--accent);flex:none}
.pr b{color:var(--fg)}
.skin{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px solid var(--line);border-radius:var(--r);text-align:left;width:100%;background:var(--card-bg)}
.skin.on{border-color:var(--accent)}
.skin .sw{width:58px;height:40px;border-radius:calc(var(--r-in) + 1px);flex:none;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;border:1px solid rgba(127,127,127,.35)}
.skin .sw i{display:block;border-radius:3px}
.skin b{display:block;font-family:var(--display);font-size:15px;font-weight:var(--h-weight)}
.skin span{font-size:12px;color:var(--muted)}
@media (min-width:700px){ #view{max-width:720px;width:100%;margin:0 auto} .tabs{justify-content:center} .tabs button{max-width:120px} }

const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const doneWorkouts=()=>S.workouts.filter(w=>w.end).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
function setsOf(exId,limit){ // all done sets for exercise, newest first: [{date,w,r,e}]
  const out=[];for(const wo of doneWorkouts()){for(const en of wo.entries){if(en.exId!==exId)continue;for(const s of en.sets){if(s.done&&s.r>0)out.push({date:wo.date,w:s.w||0,r:s.r,e:e1rm(s.w||0,s.r)})}}if(limit&&out.length>limit)break}return out;
}
const gymOf=w=>w.gym||'';
const gymBound=ex=>ex.equip==='machine'||ex.equip==='cable';
/* Machines per gym: uit de geschiedenis afleiden welke gyms dezelfde machine (schaal) hebben. Mediaan van het topgewicht per sessie, laatste 18 maanden; binnen ±15 % = zelfde machine. */
let EQ_CACHE={},EQ_KEY='';
function gymMedians(exId){const since=addDays(today(),-548);const by={};for(const w of doneWorkouts()){if(w.date<since)break;const g=gymOf(w);if(!g)continue;for(const en of w.entries){if(en.exId!==exId)continue;const m=Math.max(0,...en.sets.filter(x=>x.done&&x.w>0).map(x=>x.w));if(m>0)(by[g]=by[g]||[]).push(m)}}
  const med={};for(const g in by){if(by[g].length<2)continue;const a=by[g].sort((x,y)=>x-y);med[g]=a[Math.floor(a.length/2)]}return med}
function sameMachine(exId,g1,g2){if(g1===g2)return true;const key=S.workouts.length+':'+(S.workouts[S.workouts.length-1]?.id||'');if(key!==EQ_KEY){EQ_CACHE={};EQ_KEY=key}
  const med=EQ_CACHE[exId]||(EQ_CACHE[exId]=gymMedians(exId));if(med[g1]==null||med[g2]==null)return false;const r=med[g1]/med[g2];return r>=0.85&&r<=1.15}
function lastPerf(exId,gym){const ex=exById(exId);const list=doneWorkouts();let wo=null,other=false,equiv=false;
  if(gym&&gymBound(ex)){wo=list.find(w=>{const g=gymOf(w);return (g===gym||!g||sameMachine(exId,gym,g))&&w.entries.some(e=>e.exId===exId&&e.sets.some(s=>s.done))});if(wo&&gymOf(wo)&&gymOf(wo)!==gym)equiv=true;if(!wo)other=true}
  if(!wo)wo=list.find(w=>w.entries.some(e=>e.exId===exId&&e.sets.some(s=>s.done)));if(!wo)return null;const en=wo.entries.find(e=>e.exId===exId);return {date:wo.date,sets:en.sets.filter(s=>s.done),gym:gymOf(wo),other:other&&gymBound(ex),equiv}}
function bestE1Since(exId,since){let b=0;for(const s of setsOf(exId)){if(s.date<since)break;if(s.e>b)b=s.e}return b}
function bestE1(exId,before){let b=0;for(const s of setsOf(exId)){if(before&&s.date>=before)continue;if(s.e>b)b=s.e}return b}
function tested1RM(exId){const l=(S.oneRM[exId]||[]).slice().sort((a,b)=>a.date<b.date?1:-1);return l[0]||null}
function current1RM(exId){const t=tested1RM(exId);const e=bestE1(exId);if(t&&(!e||t.value>=e*0.97||(t.date>=addDays(today(),-60))))return {value:t.value,src:'test',date:t.date};if(e)return {value:e,src:'est'};return t?{value:t.value,src:'test',date:t.date}:null}
function volumeOf(wo){return sum(wo.entries.flatMap(e=>e.sets.filter(s=>s.done).map(s=>(s.w||0)*(s.r||0))))}
function setsDone(wo){return sum(wo.entries.map(e=>e.sets.filter(s=>s.done).length))}

/* ========= program engine ========= */
function buildProgram({name,scheme,split,days,rm}){
  const sc=SCHEMES[scheme];split=SPLITS[split]?split:'upperlower';const layout=SPLITS[split].days(clamp(days||3,2,6));
  const tm={},fails={};
  const prog={id:uid(),name,scheme,split,created:today(),cycle:1,week:0,day:0,tm,fails,log:[],
    days:layout.map(d=>({name:d.name,items:d.main.map(id=>{const ex=exById(id);return {id:uid(),exId:id,kind:'main',sets:id==='deadlift'?1:(scheme==='linear'?5:3),reps:5,inc:ex.group==='Benen'||id==='deadlift'?5:2.5}}).concat(d.acc.map(id=>{const ex=exById(id);const lp=lastPerf(id);const lw=lp?Math.max(...lp.sets.map(x=>x.w||0)):0;const lr=lp?Math.round(sum(lp.sets.map(x=>x.r||0))/lp.sets.length):0;return {id:uid(),exId:id,kind:'acc',sets:3,reps:lr>0?clamp(lr,5,20):(ex.equip==='bw'?8:10),weight:ex.equip==='bw'?0:(lw||defaultAccW(ex)),inc:ex.inc||2.5}}))}))};
  for(const d of prog.days)for(const it of d.items)if(it.kind==='main'&&tm[it.exId]==null){const r=rm[it.exId]||current1RM(it.exId)?.value||defaultRM(exById(it.exId));tm[it.exId]=roundTo(r*sc.tmFactor,S.settings.step)}
  return prog;
}
const defaultRM=ex=>({squat:80,frontsquat:60,bench:60,deadlift:100,ohp:40,row:60,rdl:80,incline:50,pullup:0})[ex.id]??40;
const defaultAccW=ex=>ex.equip==='bw'?0:ex.equip==='db'?({latraise:6,dbcurl:10,hammer:10,reardelt:6,dbrow:20,dbbench:20,dbpress:14,lunge:10,bss:10,gobletsquat:16,shrug:20})[ex.id]??10:ex.equip==='cable'?20:ex.equip==='machine'?40:20;
function planDay(prog,week,dayIdx,gym){
  const sc=SCHEMES[prog.scheme];const day=prog.days[dayIdx];
  return day.items.map(it=>{
    const ex=exById(it.exId);
    if(it.kind==='main'){const tm=prog.tm[it.exId]??0;const sets=sc.main(week,it,tm,dayIdx).map(s=>({reps:s.reps,w:ex.equip==='bw'?0:roundTo(s.w,S.settings.step),pct:s.pct,amrap:!!s.amrap}));return {item:it,ex,sets}}
    let w=it.weight||0;if(gym&&gymBound(ex)){if(it.wg&&it.wg[gym]!=null)w=it.wg[gym];else if(it.wg&&Object.keys(it.wg).some(g=>sameMachine(it.exId,gym,g)))w=it.wg[Object.keys(it.wg).find(g=>sameMachine(it.exId,gym,g))];else{const lp=lastPerf(it.exId,gym);if(lp&&!lp.other)w=Math.max(...lp.sets.map(x=>x.w||0))||w}}
    return {item:it,ex,sets:Array.from({length:it.sets},()=>({reps:it.reps,w}))};
  });
}
function progPhase(prog){return SCHEMES[prog.scheme].phase(prog.week)}
function advanceProgram(prog,wo){
  const sc=SCHEMES[prog.scheme];const notes=[];
  for(const en of wo.entries){
    if(!en.itemId)continue;const day=prog.days[wo.dayIdx];const it=day&&day.items.find(i=>i.id===en.itemId);if(!it)continue;
    const done=en.sets.filter(s=>s.done);if(!done.length)continue;
    const ex=exById(it.exId);
    const hitAll=en.target&&en.target.every((t,i)=>done[i]&&done[i].r>=t.reps);
    if(it.kind==='acc'&&ex.equip!=='bw'){if(hitAll){const g=gymOf(wo);const base=Math.max(...done.map(x=>x.w||0))||it.weight||0;const nw=roundTo(base+it.inc,ex.equip==='db'?1:S.settings.step);
      if(g&&gymBound(ex)){it.wg=it.wg||{};it.wg[g]=nw;notes.push(`${ex.name}: volgende keer ${fmtN(nw)} kg (${g})`)}else{it.weight=nw;notes.push(`${ex.name}: volgende keer ${fmtN(nw)} kg`)}}}
    if(it.kind==='main'&&(prog.scheme==='linear'&&prog.week%4!==3||prog.scheme==='topsetlin')&&ex.equip!=='bw'){
      if(hitAll){prog.tm[it.exId]=roundTo(prog.tm[it.exId]+it.inc,S.settings.step);prog.fails[it.exId]=0;notes.push(`${ex.name}: volgende keer ${fmtN(prog.tm[it.exId])} kg`)}
      else{prog.fails[it.exId]=(prog.fails[it.exId]||0)+1;if(prog.fails[it.exId]>=2){prog.tm[it.exId]=roundTo(prog.tm[it.exId]*0.9,S.settings.step);prog.fails[it.exId]=0;notes.push(`${ex.name}: twee keer gemist → reset naar ${fmtN(prog.tm[it.exId])} kg`)}else notes.push(`${ex.name}: niet alle reps, zelfde gewicht volgende keer`)}
    }
    if(it.kind==='main'&&prog.scheme!=='linear'&&prog.scheme!=='topsetlin'){const am=en.target&&en.target.find(t=>t.amrap);if(am){const idx=en.target.indexOf(am);const s=done[idx];if(s&&s.r>=am.reps+5)notes.push(`${ex.name}: ${s.r} reps op de AMRAP-set, geschatte 1RM ${fmtN(Math.round(e1rm(s.w,s.r)))} kg`)}}
  }

    if(prog.week>=sc.weeks){prog.week=0;prog.cycle++;
      if(prog.scheme!=='linear'&&prog.scheme!=='topsetlin'){for(const d of prog.days)for(const it of d.items){if(it.kind!=='main'||exById(it.exId).equip==='bw')continue;
        const est=bestE1(it.exId,addDays(today(),1));const tmNow=prog.tm[it.exId];const minEst=tmNow/sc.tmFactor;
        if(est&&est<minEst*0.97){notes.push(`${exById(it.exId).name}: training max blijft ${fmtN(tmNow)} kg (geschatte 1RM ${fmtN(Math.round(est))} kg ligt eronder)`)}
        else{prog.tm[it.exId]=roundTo(tmNow+it.inc,S.settings.step);notes.push(`${exById(it.exId).name}: nieuwe cyclus, training max → ${fmtN(prog.tm[it.exId])} kg`)}}}
      if(prog.scheme!=='topsetlin')notes.unshift(`Cyclus ${prog.cycle-1} afgerond. Start cyclus ${prog.cycle}.`);
    }
  }
  prog.log=(prog.log||[]).concat(notes.map(n=>({date:today(),n}))).slice(-40);
  return notes;
}

/* ========= krachtstandaarden (indicatief; verhouding 1RM / lichaamsgewicht) ========= */
const STD={m:{squat:[.75,1.25,1.5,2,2.5],bench:[.5,.75,1,1.5,2],deadlift:[1,1.5,2,2.5,3],ohp:[.35,.55,.8,1.05,1.35],row:[.5,.75,1,1.25,1.5]},
           v:{squat:[.5,.75,1,1.5,2],bench:[.25,.5,.75,1,1.25],deadlift:[.5,1,1.25,1.75,2.25],ohp:[.2,.35,.5,.75,.95],row:[.3,.5,.7,.9,1.1]}};
const LEVELS=['Beginner','Gevorderd beginner','Intermediair','Gevorderd','Elite'];
const ageOf=()=>S.settings.birthYear?new Date().getFullYear()-S.settings.birthYear:null;
const latestBw=()=>{const b=S.bodyweight.slice().sort((a,c)=>a.date<c.date?1:-1)[0];return b?b.kg:null};
function benchmark(exId){const sex=S.settings.sex==='v'?'v':S.settings.sex==='m'?'m':null;const bw=latestBw();const rm=current1RM(exId);if(!sex||!bw||!rm||!STD[sex][exId])return null;
  const age=ageOf();const f=age&&age>35?Math.max(.7,1-0.01*(age-35)):1;const ratio=rm.value/bw;const th=STD[sex][exId].map(x=>x*f);
  let lvl=0;for(let i=0;i<th.length;i++)if(ratio>=th[i])lvl=i+1;const lo=lvl===0?0:th[lvl-1],hi=lvl>=th.length?th[th.length-1]*1.2:th[lvl];const prog=clamp((ratio-lo)/(hi-lo),0,1);
  return {ratio,level:lvl===0?'Onder beginner':LEVELS[lvl-1],lvlIdx:lvl,next:lvl<th.length?{name:LEVELS[lvl],kg:Math.round(th[lvl]*bw)}:null,prog,bw,f,rm:rm.value}}
const profileLine=()=>{const p=[];if(S.settings.sex)p.push({m:'man',v:'vrouw',x:'anders'}[S.settings.sex]);const a=ageOf();if(a)p.push(a+' jaar');const bw=latestBw();if(bw)p.push(fmtN(bw)+' kg');if(S.settings.height)p.push(S.settings.height+' cm');return p.join(', ')};

const fmtSets=sets=>{const g=[];for(const s of sets){const k=`${s.reps}${s.amrap?'+':''}@${s.w}`;const last=g[g.length-1];if(last&&last.k===k)last.n++;else g.push({k,n:1,s})}return g.map(x=>`${x.n}×${x.s.reps}${x.s.amrap?'<span class="amrap">+</span>':''}${x.s.w?` @ ${fmtN(x.s.w)} kg`:''}`).join(' · ')};
function woRow(w){return `<button class="item" data-act="openWo" data-id="${w.id}"><div class="fig" style="background:var(--accent-soft);color:var(--accent)">${I.cal}</div><div class="t"><b>${esc(w.name)}</b><span>${fmtD(w.date)}${w.gym?` · ${esc(w.gym)}`:''} · ${w.entries.length} oef. · ${setsDone(w)} sets · ${fmtK(volumeOf(w))}</span></div><div class="r muted">›</div></button>`}
function streak(){const weeks=new Set(doneWorkouts().map(w=>weekKey(w.date)));let n=0,k=weekKey(today());if(!weeks.has(k))k=addDays(k,-7);while(weeks.has(k)){n++;k=addDays(k,-7)}return n}
function recentPRs(n){const out=[];const seen={};for(const wo of doneWorkouts()){for(const en of wo.entries){let best=null;for(const s of en.sets)if(s.done&&s.r>0){const e=e1rm(s.w,s.r);if(!best||e>best.e)best={w:s.w,r:s.r,e}}if(!best||seen[en.exId])continue;const prev=bestE1(en.exId,wo.date);if(best.e>prev&&prev>0){out.push({ex:exById(en.exId),date:wo.date,...best});seen[en.exId]=1}}if(out.length>=n)break}return out}

function finishWorkout(){
  const wo=S.active;const done=wo.entries.filter(e=>e.sets.some(s=>s.done));
  if(!done.length){confirmSheet('Niets gelogd','Er is nog geen enkele set afgevinkt. Training weggooien?','Weggooien',()=>{S.active=null;S.timerEnd=null;save();render()},true);return}
  wo.entries=wo.entries.map(e=>{const x={...e,sets:e.sets.filter(s=>s.done||s.r)};delete x.showNote;return x});
  // PRs before saving
  const prs=[];for(const en of wo.entries){let best=0,bs=null;for(const s of en.sets)if(s.done&&s.r>0){const e=e1rm(s.w||0,s.r);if(e>best){best=e;bs=s}}const prev=bestE1(en.exId);if(bs&&best>prev&&(bs.w||0)>0)prs.push({ex:exById(en.exId),w:bs.w,r:bs.r,e:best,first:prev===0})}
  wo.end=Date.now();S.workouts.push(wo);S.active=null;S.timerEnd=null;try{ANDROID()&&ANDROID().keepAwake(false)}catch(e){}
  let notes=[];const p=S.programs.find(x=>x.id===wo.programId);if(p&&wo.dayIdx!=null)notes=advanceProgram(p,wo);

function progText(p){const sc=SCHEMES[p.scheme];const L=[`${p.name}`,`${sc.name}${p.split&&SPLITS[p.split]?' · '+SPLITS[p.split].name:''} · ${p.days.length} dagen/week`];
  if(Object.keys(p.tm).length)L.push('Training max: '+Object.entries(p.tm).map(([id,v])=>`${exById(id).name} ${fmtN(v)} kg`).join(', '));
  for(const d of p.days){L.push('',d.name);for(const it of d.items){const ex=exById(it.exId);L.push(`- ${ex.name}: ${it.kind==='main'?'hoofdoefening (volgens schema)':`${it.sets}×${it.reps}${it.weight?' @ '+fmtN(it.weight)+' kg':''}, +${fmtN(it.inc)} kg bij succes`}`)}}
  return L.join('\n')}
function progCode(p){const o={power:1,name:p.name,scheme:p.scheme,split:p.split||'blank',tm:p.tm,days:p.days.map(d=>({name:d.name,items:d.items.map(it=>({ex:it.exId,exName:exById(it.exId).name,group:exById(it.exId).group,equip:exById(it.exId).equip,kind:it.kind,sets:it.sets,reps:it.reps,weight:it.weight||0,inc:it.inc}))}))};return 'POWER:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function importProgCode(txt){txt=(txt||'').trim();const m=txt.match(/POWER:([A-Za-z0-9+/=]+)/);if(!m)throw new Error('Geen Power-code gevonden');const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||o.power!==1||!Array.isArray(o.days))throw new Error('Ongeldige code');
  const prog={id:uid(),name:o.name||'Geïmporteerd programma',scheme:SCHEMES[o.scheme]?o.scheme:'linear',split:SPLITS[o.split]?o.split:'blank',created:today(),cycle:1,week:0,day:0,tm:{},fails:{},log:[],days:[]};
  for(const d of o.days){const day={name:d.name||'Dag',items:[]};for(const it of d.items||[]){let exId=it.ex;if(!allEx().some(e=>e.id===exId)){const byName=allEx().find(e=>e.name.toLowerCase()===(it.exName||'').toLowerCase());if(byName)exId=byName.id;else{exId='c_'+uid();S.customEx.push({id:exId,name:it.exName||'Onbekende oefening',group:GROUPS.includes(it.group)?it.group:'Core',equip:EQUIP[it.equip]?it.equip:'machine',pose:'squat',inc:it.inc||2.5,custom:true})}}
    day.items.push({id:uid(),exId,kind:it.kind==='main'?'main':'acc',sets:clamp(+it.sets||3,1,12),reps:clamp(+it.reps||8,1,100),weight:+it.weight||0,inc:+it.inc||2.5});
    if(it.kind==='main'&&prog.tm[exId]==null){const v=o.tm&&o.tm[it.ex];prog.tm[exId]=v||roundTo((current1RM(exId)?.value||defaultRM(exById(exId)))*SCHEMES[prog.scheme].tmFactor,S.settings.step)}}
    prog.days.push(day)}
  if(!prog.days.length)throw new Error('Programma zonder dagen');return prog}

let exGym='',exAll=false;
function setsOfGym(exId,gym){const out=[];for(const wo of doneWorkouts()){if(gym&&gymOf(wo)&&gymOf(wo)!==gym)continue;for(const en of wo.entries){if(en.exId!==exId)continue;for(const s of en.sets){if(s.done&&s.r>0)out.push({date:wo.date,w:s.w||0,r:s.r,e:e1rm(s.w||0,s.r)})}}}return out}
function exDetail(id){const ex=exById(id);const rm=current1RM(id);const t=tested1RM(id);const gb=gymBound(ex);if(!gb)exGym='';const gyms=gb?[...new Set(doneWorkouts().filter(w=>w.entries.some(e=>e.exId===id)).map(gymOf).filter(Boolean))]:[];const sets=setsOfGym(id,exGym);const est=sets.reduce((b,x)=>Math.max(b,x.e),0);

  const best=sets.reduce((b,s)=>s.w*s.r>0&&(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))?s:b,null);

    <div class="row wrap"><span class="pill"><span class="dot g-${ex.group}"></span>${ex.group}</span><span class="pill">${EQUIP[ex.equip]}</span>${ex.big?'<span class="pill acc">hoofdoefening</span>':''}</div>

    ${(S.oneRM[id]||[]).length?`<div class="card"><h3>Geteste 1RM's</h3><div class="list">${(S.oneRM[id]||[]).slice().sort((a,b)=>a.date<b.date?1:-1).map((r,i)=>`<div class="item" style="padding:7px 0"><div class="t"><b>${fmtN(r.value)} kg</b><span>${fmtDl(r.date)}${r.src==='est'?' · geschat':''}</span></div><button class="btn sm ghost" data-rmdel="${r.date}|${r.value}" aria-label="Verwijder">${I.trash}</button></div>`).join('')}</div></div>`:''}

/* ========= STATS ========= */
let statRange=84,statEx=null;
function vStats(){
  const from=statRange?addDays(today(),-statRange):'0000';const wos=doneWorkouts().filter(w=>w.date>=from).reverse();
  const weeks={};for(const w of wos){const k=weekKey(w.date);weeks[k]=weeks[k]||{vol:0,sets:0,n:0};weeks[k].vol+=volumeOf(w);weeks[k].sets+=setsDone(w);weeks[k].n++}
  const wk=[];let k=weekKey(from==='0000'?(wos[0]?.date||today()):from);const end=weekKey(today());while(k<=end){wk.push({x:k,y:Math.round(weeks[k]?.vol||0),sets:weeks[k]?.sets||0});k=addDays(k,7)}
  const grp={};for(const w of wos)for(const en of w.entries){const g=exById(en.exId).group;grp[g]=(grp[g]||0)+en.sets.filter(s=>s.done).length}const gmax=Math.max(1,...Object.values(grp));
  const lifts=[...new Set(wos.flatMap(w=>w.entries.map(e=>e.exId)))].map(exById).filter(e=>e.equip!=='bw').sort((a,b)=>(b.big-a.big)||a.name.localeCompare(b.name));
  if(!statEx||!lifts.some(l=>l.id===statEx))statEx=lifts[0]?.id||null;
  const liftPts=[];if(statEx){const seen={};for(const w of wos){let b=0;for(const en of w.entries)if(en.exId===statEx)for(const s of en.sets)if(s.done&&s.r>0)b=Math.max(b,e1rm(s.w,s.r));if(b>0)seen[w.date]=Math.max(seen[w.date]||0,Math.round(b))}for(const d of Object.keys(seen).sort())liftPts.push({x:d,y:seen[d]})}
  const bw=S.bodyweight.slice().sort((a,b)=>a.date<b.date?-1:1).filter(b=>b.date>=from).map(b=>({x:b.date,y:b.kg}));
  const totalVol=sum(wos.map(volumeOf));
  view(`<div class="chips">${[[28,'4 weken'],[84,'12 weken'],[365,'1 jaar'],[0,'Alles']].map(([v,l])=>`<button class="chip ${statRange===v?'on':''}" data-range="${v}">${l}</button>`).join('')}</div>
    <div class="tiles"><div class="tile"><b>${wos.length}</b><span>trainingen</span></div><div class="tile"><b>${sum(wos.map(setsDone))}</b><span>sets</span></div><div class="tile"><b>${fmtK(totalVol).replace(' kg','').replace(' t','')}</b><span>${totalVol>=1000?'ton':'kg'} volume</span></div></div>
    ${(()=>{const ids=['squat','bench','deadlift','ohp','row'].filter(id=>benchmark(id));if(!S.settings.sex||!latestBw())return `<div class="card"><h3>Krachtstandaarden</h3><p class="note" style="margin-top:8px">Vul geslacht, geboortejaar en lichaamsgewicht in (Meer → Profiel, en Wegen) om je 1RM's te vergelijken met gangbare krachtstandaarden.</p></div>`;if(!ids.length)return '';
      return `<div class="card"><div class="sec"><h3>Krachtstandaarden</h3><span class="small muted">${esc(profileLine())}</span></div><div class="col" style="margin-top:10px">${ids.map(id=>{const b=benchmark(id);const ex=exById(id);return `<div><div class="row between"><b>${esc(ex.name)}</b><span class="small num">${fmtN(Math.round(b.rm))} kg · ${b.ratio.toFixed(2)}× bw</span></div><div class="row" style="gap:8px;margin-top:4px"><div class="bar" style="flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden"><i style="display:block;height:100%;width:${Math.round((b.lvlIdx+b.prog)/5*100)}%;background:var(--accent);border-radius:4px"></i></div><span class="small" style="min-width:120px;text-align:right">${esc(b.level)}</span></div>${b.next?`<div class="small muted">Volgende: ${esc(b.next.name)} vanaf ±${b.next.kg} kg</div>`:'<div class="small muted">Hoogste niveau</div>'}</div>`}).join('')}</div><p class="note" style="margin-top:10px">Indicatief, gebaseerd op gangbare verhoudingen 1RM/lichaamsgewicht per geslacht${ageOf()&&ageOf()>35?`, gecorrigeerd voor leeftijd (×${benchmark(ids[0]).f.toFixed(2)})`:''}. Geen medisch of wedstrijdoordeel.</p></div>`})()}

/* ========= charts (inline SVG, single series, hover tooltip) ========= */
const CH={};
function lineChart({id,pts,unit='',h=160,dec=0}){
  const W=340,pl=38,pr=12,pt=14,pb=26;const xs=pts.map(p=>parseD(p.x).getTime());const ys=pts.map(p=>p.y);
  let y0=Math.min(...ys),y1=Math.max(...ys);const span=(y1-y0)||Math.max(1,y1*.1);y0=y0-span*.15;y1=y1+span*.15;if(Math.min(...ys)>=0)y0=Math.max(0,y0);
  const x0=xs[0],x1=xs[xs.length-1]||x0+1;const X=t=>pl+(x1===x0?(W-pl-pr)/2:(t-x0)/(x1-x0)*(W-pl-pr));const Y=v=>pt+(1-(v-y0)/(y1-y0))*(h-pt-pb);
  const ticks=[0,1,2,3].map(i=>y0+(y1-y0)*i/3);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${path} L${X(x1).toFixed(1)},${(h-pb).toFixed(1)} L${X(x0).toFixed(1)},${(h-pb).toFixed(1)} Z`;
  const xl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>({x:X(xs[i]),l:fmtD(pts[i].x)}));
  CH[id]={pts:pts.map((p,i)=>({x:X(xs[i]),y:Y(p.y),l:`${fmtDl(p.x)}: ${p.y.toFixed(dec).replace('.',',')}${unit}`})),W,h};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${h}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--body)">${t.toFixed(dec).replace('.',',')}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${xl.map((t,i)=>`<text x="${t.x.toFixed(1)}" y="${h-8}" font-size="10" fill="var(--muted)" text-anchor="${i===0?'start':i===xl.length-1?'end':'middle'}" font-family="var(--body)">${t.l}</text>`).join('')}
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${h-pb}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
  </svg><div class="tip" hidden></div></div>`;
}
function barChart({id,pts,unit='',h=150}){
  const W=340,pl=38,pr=8,pt=10,pb=24;const max=Math.max(1,...pts.map(p=>p.y));const n=pts.length;const bw=(W-pl-pr)/n;const Y=v=>pt+(1-v/max)*(h-pt-pb);
  const ticks=[0,.5,1].map(f=>max*f);
  CH[id]={pts:pts.map((p,i)=>({x:pl+bw*(i+.5),y:Y(p.y),l:`Week van ${fmtD(p.x)}: ${Math.round(p.y).toLocaleString('nl-BE')}${unit} · ${p.sets} sets`})),W,h};
  const lab=pts.length<=6?pts.map((p,i)=>i):[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${h}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)"/><text x="${pl-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--body)">${t>=1000?(Math.round(t/100)/10)+'t':Math.round(t)}</text>`).join('')}
    ${pts.map((p,i)=>{const x=pl+bw*i+Math.max(1,bw*.15),w=Math.max(2,bw*.7),y=Y(p.y),hh=Math.max(0,h-pb-y);return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="var(--accent)" opacity="${i===n-1?1:.75}"/>`}).join('')}
    ${lab.map(i=>`<text x="${(pl+bw*(i+.5)).toFixed(1)}" y="${h-7}" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="var(--body)">${+pts[i].x.slice(8)}/${+pts[i].x.slice(5,7)}</text>`).join('')}
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${h-pb}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
  </svg><div class="tip" hidden></div></div>`;
}
function bindCharts(root){$$('.chart',root).forEach(c=>{const d=CH[c.dataset.chart];if(!d)return;const svg=$('svg',c),tip=$('.tip',c),xh=$('.xh',c);
  const mv=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*d.W;let best=null;for(const p of d.pts){const dx=Math.abs(p.x-px);if(!best||dx<best.dx)best={...p,dx}}if(!best)return;tip.hidden=false;tip.textContent=best.l;tip.style.left=(best.x/d.W*100)+'%';tip.style.top=(best.y/d.h*100)+'%';xh.setAttribute('x1',best.x);xh.setAttribute('x2',best.x);xh.setAttribute('opacity','.35')};
  const out=()=>{tip.hidden=true;xh.setAttribute('opacity','0')};
  c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);c.addEventListener('pointerleave',out)})}

function addBW(){sheet('Lichaamsgewicht',`<div class="grid2"><label class="f"><span>Gewicht (kg)</span><input type="number" id="bwV" step="0.1" inputmode="decimal" value="${S.bodyweight.length?S.bodyweight.slice().sort((a,b)=>a.date<b.date?1:-1)[0].kg:''}"></label><label class="f"><span>Datum</span><input type="date" id="bwD" value="${today()}"></label></div><button class="btn p block" id="bwOk">Opslaan</button>`,{onMount:b=>{$('#bwOk',b).onclick=()=>{const v=num($('#bwV',b).value);const d=$('#bwD',b).value||today();if(!v){toast('Vul een gewicht in');return}S.bodyweight=S.bodyweight.filter(x=>x.date!==d);S.bodyweight.push({date:d,kg:v});save();closeSheet();render()}}})}
let exportRange=84;
function exportWos(){const from=exportRange?addDays(today(),-exportRange):'0000';return doneWorkouts().filter(w=>w.date>=from).reverse()}
function exportInfo(){const w=exportWos();return w.length?`${w.length} trainingen, ${fmtD(w[0].date)} – ${fmtD(w[w.length-1].date)}`:'Geen trainingen in deze periode.'}
function exportMd(){
  const wos=exportWos();const p=activeProgram();const L=[];
  L.push(`# Power export · ${S.settings.name||'gebruiker'} · ${fmtDl(today())}`);
  L.push(`Periode: ${exportRange?`laatste ${exportRange} dagen`:'volledige geschiedenis'} · ${wos.length} trainingen · gewichten in kg, notatie kg×reps (BW = lichaamsgewicht).`);
  if(profileLine())L.push(`Profiel: ${profileLine()}`);
  const bms=['squat','bench','deadlift','ohp','row'].map(id=>({id,b:benchmark(id)})).filter(x=>x.b);if(bms.length)L.push('Krachtstandaard (indicatief): '+bms.map(x=>`${exById(x.id).name} ${x.b.ratio.toFixed(2)}× bw = ${x.b.level}`).join('; '));
  const lifts=allEx().filter(e=>(e.big||e.equip==='bar')&&(tested1RM(e.id)||bestE1(e.id))).map(e=>({e,t:tested1RM(e.id),best:bestE1(e.id),rec:bestE1Since(e.id,addDays(today(),-90))})).sort((a,b)=>Math.max(b.best,b.t?.value||0)-Math.max(a.best,a.t?.value||0)).slice(0,12);
  if(lifts.length){L.push('','## 1RM (barbell-oefeningen)');for(const x of lifts)L.push(`- ${x.e.name}: ${x.t?`getest ${fmtN(x.t.value)} kg (${fmtDl(x.t.date)})`:'niet getest'} · beste e1RM ooit ${fmtN(Math.round(x.best))} kg · beste e1RM laatste 90 dagen ${x.rec?fmtN(Math.round(x.rec)):'—'} kg`)}
  if(p){const sc=SCHEMES[p.scheme];L.push('','## Actief programma',`${p.name} · ${sc.name}${p.split&&SPLITS[p.split]?' · '+SPLITS[p.split].name:''} · ${p.days.length} dagen/week · cyclus ${p.cycle}, week ${p.week+1}/${sc.weeks} (${progPhase(p)}), volgende: ${p.days[p.day].name}`);L.push('Training max: '+Object.entries(p.tm).map(([id,v])=>`${exById(id).name} ${fmtN(v)}`).join(', '));
    for(const d of p.days)L.push(`- ${d.name}: ${d.items.map(it=>`${exById(it.exId).name}${it.kind==='main'?' (hoofd)':` ${it.sets}×${it.reps}${it.weight?' @ '+fmtN(it.weight):''}`}`).join('; ')}`)}
  const bw=S.bodyweight.slice().sort((a,b)=>a.date<b.date?-1:1);if(bw.length)L.push('','## Lichaamsgewicht',bw.slice(-12).map(b=>`${b.date}: ${fmtN(b.kg)} kg`).join(' · '));
  L.push('','## Trainingen (oudste eerst)');
  for(const w of wos){L.push('',`### ${w.date} · ${w.name}${w.gym?` · ${w.gym}`:''}${w.notes?` · ${w.notes}`:''}`);for(const en of w.entries){const ss=en.sets.filter(x=>x.done&&x.r>0);if(!ss.length&&!en.note)continue;L.push(`- ${exById(en.exId).name}: ${ss.map(x=>`${fmtW(x.w)}×${x.r}${x.rpe?` RPE${x.rpe}`:''}${x.note?` (${x.note})`:''}`).join(', ')||'—'}${en.note?` · ${en.note}`:''}`)}}
  return L.join('\n');
}
function exportCsv(){const L=['datum;training;oefening;spiergroep;set;kg;reps;e1rm'];for(const w of exportWos())for(const en of w.entries){const ex=exById(en.exId);en.sets.filter(x=>x.done&&x.r>0).forEach((x,i)=>L.push([w.date,w.name,ex.name,ex.group,i+1,String(x.w||0).replace('.',','),x.r,Math.round(e1rm(x.w||0,x.r))].join(';')))}return L.join('\n')}
function copyText(txt,label){if(ANDROID()){const name=label.replace(/[^\w]+/g,'-').toLowerCase()+'-'+today()+(/csv/i.test(label)?'.csv':/json|back-up|geschiedenis/i.test(label)?'.json':'.txt');sheet(label,`<p class="note">Kies wat je ermee doet.</p><button class="btn p block" id="ntCopy">Kopieer naar klembord</button>${nativeButtons(txt,name,/csv/i.test(label)?'text/csv':/json|back-up|geschiedenis/i.test(label)?'application/json':'text/plain')}`,{onMount:b=>{bindNative(b,txt);$('#ntCopy',b).onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>{closeSheet();toast(`${label} gekopieerd`)}).catch(()=>toast('Kopiëren lukte niet'))}}});return}

function exportHistory(){return JSON.stringify({power:'history',v:1,exported:today(),name:S.settings.name||'',profile:{sex:S.settings.sex||'',birthYear:S.settings.birthYear||null,height:S.settings.height||null},workouts:S.workouts,oneRM:S.oneRM,bodyweight:S.bodyweight,programs:S.programs,activeProgramId:S.activeProgramId,customEx:S.customEx})}
function importHistory(txt,mode){let o;try{o=JSON.parse(txt)}catch(e){throw new Error('Geen geldig bestand')}
  const isBackup=o&&o.settings&&Array.isArray(o.workouts);const isHist=o&&o.power==='history'&&Array.isArray(o.workouts);if(!isBackup&&!isHist)throw new Error('Dit is geen Power-geschiedenis of -back-up');
  if(mode==='replace'){S.workouts=o.workouts||[];S.oneRM=o.oneRM||{};S.bodyweight=o.bodyweight||[];S.programs=o.programs||[];S.customEx=o.customEx||[];S.activeProgramId=o.activeProgramId||S.programs[0]?.id||null;if(isBackup)S.settings=Object.assign(defaultState().settings,o.settings);else{if(o.name&&!S.settings.name)S.settings.name=o.name;if(o.profile){S.settings.sex=S.settings.sex||o.profile.sex||'';S.settings.birthYear=S.settings.birthYear||o.profile.birthYear||null;S.settings.height=S.settings.height||o.profile.height||null}}}
  else{const have=new Set(S.workouts.map(w=>w.id));let n=0;for(const w of o.workouts||[]){if(!have.has(w.id)&&!S.workouts.some(x=>x.date===w.date&&x.name===w.name&&x.entries.length===w.entries.length)){S.workouts.push(w);n++}}
    for(const k in (o.oneRM||{})){S.oneRM[k]=(S.oneRM[k]||[]).concat((o.oneRM[k]||[]).filter(r=>!(S.oneRM[k]||[]).some(x=>x.date===r.date&&x.value===r.value)))}
    for(const b of o.bodyweight||[])if(!S.bodyweight.some(x=>x.date===b.date))S.bodyweight.push(b);
    for(const e of o.customEx||[])if(!allEx().some(x=>x.id===e.id))S.customEx.push(e);
    for(const p of o.programs||[])if(!S.programs.some(x=>x.id===p.id))S.programs.push(p);
    if(!S.activeProgramId&&o.activeProgramId)S.activeProgramId=o.activeProgramId;if(o.name&&!S.settings.name)S.settings.name=o.name;
    return n}
  return (o.workouts||[]).length}

function loadDemo(){
  const rm={squat:100,bench:75,deadlift:130,ohp:47.5};const p=buildProgram({name:'5/3/1 voorbeeld',scheme:'w531',split:'powerlifting',days:4,rm});p.demo=true;S.programs.push(p);S.activeProgramId=p.id;
  for(const [id,v] of Object.entries(rm))(S.oneRM[id]=S.oneRM[id]||[]).push({date:addDays(today(),-70),value:v,src:'test'});
  let date=addDays(today(),-66);let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let w=0;w<9;w++){for(let d=0;d<4;d++){const plan=planDay(p,p.week,p.day);const wo={id:uid(),date,start:parseD(date).getTime()+18*3600e3,end:parseD(date).getTime()+19*3600e3,name:p.days[p.day].name,programId:p.id,week:p.week,dayIdx:p.day,notes:'',demo:true,
      entries:plan.map(x=>({exId:x.ex.id,itemId:x.item.id,kind:x.item.kind,target:x.sets,sets:x.sets.map(s=>({w:s.w,r:s.amrap?s.reps+2+Math.floor(rnd()*5):s.reps-(rnd()<.08?1:0),done:true}))}))};
      S.workouts.push(wo);advanceProgram(p,wo);date=addDays(date,d===1?2:d===3?2:1)}date=addDays(date,0)}
  for(let i=0;i<10;i++)S.bodyweight.push({date:addDays(today(),-63+i*7),kg:Math.round((84-i*.25+(rnd()-.5))*10)/10});
  p.log=p.log.slice(-6);save();
}
function removeDemo(){S.workouts=S.workouts.filter(w=>!w.demo);S.programs=S.programs.filter(p=>!p.demo);if(!S.programs.some(p=>p.id===S.activeProgramId))S.activeProgramId=S.programs[0]?.id||null;S.bodyweight=[];for(const k of Object.keys(S.oneRM))S.oneRM[k]=S.oneRM[k].filter(r=>r.date!==addDays(today(),-70));save();render();toast('Voorbeelddata verwijderd')}

function toggleFs(){
  if(isFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  const el=document.documentElement;const req=el.requestFullscreen||el.webkitRequestFullscreen;
  const fail=()=>sheet('Volledig scherm',`<p class="note" style="font-size:15px;color:var(--fg)">De browser staat volledig scherm hier niet toe (de app draait binnen de claude.ai-pagina).</p><p class="note">Zonder balken werkt wel: open deze link in Chrome, tik op ⋮ → <b>Toevoegen aan startscherm</b>. Start je Power daarna via dat icoon, dan opent ze schermvullend, zonder adresbalk en zonder de claude.ai-balk.</p><button class="btn p block" data-close>Begrepen</button>`);
  if(!req){fail();return}
  try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(fail)}catch(e){fail()}
}

});
document.addEventListener('input',e=>{const i=e.target.closest('[data-enote]');if(!i||!S.active)return;S.active.entries[+i.dataset.enote].note=i.value;save()});
document.addEventListener('change',e=>{const i=e.target.closest('[data-set]');if(!i||!S.active)return;const [a,b,k]=i.dataset.set.split(',');const s=S.active.entries[+a].sets[+b];s[k]=num(i.value);save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('resize',()=>{});

/* ========= boot ========= */
if(S.timerEnd&&S.timerEnd>Date.now())drawTimer();else S.timerEnd=null;
render();
try{setTimeout(()=>checkUpdate(false),1500)}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
