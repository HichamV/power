name: Power APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          rm -f android/local.properties
      - name: Signing key from secrets
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/power.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=power\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew build-apk.sh
          ./build-apk.sh ci
      - name: Version
        id: ver
        run: echo "v=$(grep versionName android/version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: android/Power.apk
          generate_release_notes: true
